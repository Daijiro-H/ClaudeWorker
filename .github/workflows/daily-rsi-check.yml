name: Daily S&P500 RSI Check

on:
  schedule:
    # 22:30 UTC, Mon-Fri (after the US market close)
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  # Needed so the run can create and update the tracking issue.
  issues: write
  contents: read

jobs:
  check-rsi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run RSI check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_ASSIGNEE: ${{ github.repository_owner }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python scripts/check_sp500_rsi.py
